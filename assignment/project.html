<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Designer Trial Brief — Rotex RTX-7 Case Study | Ritik &amp; Co.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#09090b;--card:#18181b;--card-d:#111113;--border:#27272a;
  --text:#fafaf9;--muted:#a1a1aa;--dim:#71717a;
  --accent:#10b981;--accent-d:#059669;--accent-bg:rgba(16,185,129,.1);--accent-line:rgba(16,185,129,.28);
  --head:'Syne','Inter',system-ui,sans-serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --wrap:880px;
}
html{font-size:16px;-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--body);line-height:1.65;-webkit-font-smoothing:antialiased;min-height:100vh;position:relative;overflow-x:hidden}
body::before{content:"";position:absolute;top:0;right:0;width:100%;max-width:760px;height:640px;background:radial-gradient(circle at 85% 8%,rgba(16,185,129,.14) 0%,transparent 60%);pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:var(--wrap);margin:0 auto;padding:0 24px}

/* header */
.site-head{border-bottom:1px solid var(--border);padding:28px 0 22px}
.head-row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.logo{font-family:var(--head);font-weight:800;font-size:1.5rem;letter-spacing:-.02em;line-height:1}
.logo span{color:var(--accent)}
.logo-bar{width:42px;height:2px;background:var(--accent);margin:10px 0 9px}
.tagline{font-size:.72rem;font-weight:500;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.tagline i{font-style:normal;padding:0 .5em;opacity:.6}
.doc-tag{font-size:.72rem;font-weight:600;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;padding-top:4px;text-align:right}

/* hero */
.hero{padding:64px 0 48px}
.chip{display:inline-block;font-size:.68rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);background:var(--accent-bg);border:1px solid var(--accent-line);padding:6px 14px;border-radius:100px;margin-bottom:22px}
h1{font-family:var(--head);font-weight:800;font-size:clamp(2.4rem,8vw,4.1rem);line-height:1.02;letter-spacing:-.03em}
h1 .g{color:var(--accent);display:block}
.lede{margin-top:20px;color:var(--muted);font-size:1.05rem;max-width:520px}

/* sections */
section{padding:0 0 40px}
.label{font-size:.72rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:14px}
.label-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.label-row .label{margin-bottom:0}
.note{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:500}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px 26px}
.card p{color:var(--muted);font-size:.95rem}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}

/* deliverables */
.deliv{display:flex;gap:18px;align-items:flex-start}
.deliv-n{font-family:var(--head);font-weight:800;font-size:2rem;line-height:1;color:var(--accent-line);flex-shrink:0;min-width:44px}
.deliv h3{font-family:var(--head);font-weight:700;font-size:1.08rem;margin-bottom:6px;letter-spacing:-.01em}
.deliv p{font-size:.88rem}

/* copy table */
.copy{padding:0}
.copy dl{display:block}
.row{display:grid;grid-template-columns:200px 1fr;gap:20px;padding:18px 26px;border-bottom:1px solid var(--border);align-items:baseline}
.row:last-child{border-bottom:none}
.row dt{font-size:.68rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.row dd{color:var(--text);font-weight:500;font-size:.95rem;letter-spacing:.02em}
.row.h dd{font-family:var(--head);font-weight:800;font-size:1.3rem;line-height:1.2;letter-spacing:.01em}
.hier{margin-top:16px;background:var(--card-d);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:0 12px 12px 0;padding:20px 24px}
.hier p{color:var(--muted);font-size:.92rem}

/* references */
.refs{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:28px;align-items:start}
figure img{display:block;width:100%;height:auto;border-radius:10px;border:1px solid var(--border)}
figcaption{margin-top:14px;font-size:.84rem;color:var(--muted);line-height:1.65}
figcaption b{color:var(--accent);font-weight:600}

/* lists */
.list{list-style:none}
.list li{position:relative;padding-left:20px;color:var(--text);font-size:.92rem;margin-bottom:10px}
.list li:last-child{margin-bottom:0}
.list li::before{content:"";position:absolute;left:0;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.card .label{margin-bottom:16px}

/* timeline */
.fields{display:grid;gap:14px}
.field{display:grid;grid-template-columns:110px 1fr;gap:16px;align-items:end;font-size:.9rem;font-weight:600;color:var(--muted)}
.field span.line{border-bottom:1px solid #3f3f46;height:22px}

/* confidential */
.conf{background:#0c1f19;border:1px solid #0f5a42;border-radius:12px;padding:24px 26px}
.conf p{color:var(--text);font-size:.92rem}

/* footer */
.site-foot{border-top:1px solid var(--border);padding:22px 24px 40px;margin-top:8px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:.74rem;color:var(--dim)}

@media (max-width:720px){
  .wrap,.site-foot{padding-left:18px;padding-right:18px}
